services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-track}
      POSTGRES_USER: ${POSTGRES_USER:-track}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-track}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-track} -d ${POSTGRES_DB:-track}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-track}:${POSTGRES_PASSWORD:-track}@db:5432/${POSTGRES_DB:-track}
      PORT: 8000
      APP_BASE_URL: ${APP_BASE_URL:-}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
